<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WorkBuddy 电商运营一体化协同工作台</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        html, body { overflow-x: hidden; width: 100%; -webkit-tap-highlight-color: transparent; }
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .log-scroll { overflow-y: scroll !important; -webkit-overflow-scrolling: touch; }
        .log-scroll::-webkit-scrollbar { width: 5px; }
        .log-scroll::-webkit-scrollbar-track { background: #f8fafc; }
        .log-scroll::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
        
        .btn-export-excel {
            background-color: #059669 !important;
            color: #ffffff !important;
            border: 1px solid #047857 !important;
            font-weight: 700 !important;
        }
        .btn-export-excel:hover { background-color: #047857 !important; }

        .rich-note s, .rich-note del, .rich-note strike { text-decoration: line-through; color: #94a3b8; }
        .rich-note a { color: #2563eb; text-decoration: underline; word-break: break-all; }

        .ai-chat-bubble-user { background-color: #2563eb; color: white; border-bottom-right-radius: 2px; }
        .ai-chat-bubble-bot { background-color: #f1f5f9; color: #1e293b; border-bottom-left-radius: 2px; }

        @media (max-width: 860px) {
            .desktop-table-view { display: none !important; }
            .mobile-card-view { display: block !important; }
        }
        @media (min-width: 861px) {
            .desktop-table-view { display: block !important; }
            .mobile-card-view { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen antialiased relative">

    <div class="w-full max-w-7xl mx-auto px-2 sm:px-6 py-3 sm:py-5">
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-3 bg-white p-3.5 sm:p-4 rounded-xl border border-gray-200 shadow-sm">
            <div>
                <h1 class="text-base sm:text-xl font-bold text-gray-900 flex items-center space-x-2">
                    <span class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-2 py-0.5 rounded-lg text-xs tracking-wide">WorkBuddy</span>
                    <span>电商运营超级工作台</span>
                    <span id="role-badge" class="text-[10px] sm:text-xs bg-blue-100 text-blue-800 border border-blue-200 px-1.5 sm:px-2 py-0.5 rounded font-semibold">管理模式</span>
                </h1>
                <p class="text-[11px] sm:text-xs text-gray-500 mt-0.5" id="header-desc">仓库新品矩阵 · Gist 69码库 · 独立价格中枢 · 双 Token 独立鉴权</p>
            </div>
            <div class="flex items-center space-x-2 flex-wrap w-full sm:w-auto justify-between sm:justify-end">
                <span id="auth-tag" class="text-[10px] sm:text-xs bg-gray-100 text-gray-600 border border-gray-200 px-2.5 sm:px-3 py-1 rounded-full font-medium flex items-center space-x-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 inline-block"></span>
                    <span id="auth-tag-text">检测中...</span>
                </span>
                <div class="flex items-center space-x-1.5">
                    <button onclick="toggleAIChatDrawer()" class="bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white px-2.5 py-1 sm:py-1.5 rounded-lg text-[11px] sm:text-xs font-bold transition flex items-center space-x-1 shadow-xs">
                        <span>🤖 WorkBuddy 助手</span>
                    </button>
                    <button id="btn-share-readonly" onclick="copyReadOnlyShareLink()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-2.5 py-1 sm:py-1.5 rounded-lg text-[11px] sm:text-xs border border-indigo-200 font-bold transition">
                        🔗 只读链接
                    </button>
                    <button id="btn-config" onclick="toggleConfigModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-2.5 py-1 sm:py-1.5 rounded-lg text-[11px] sm:text-xs border border-gray-300 font-medium">⚙️ 多源配置</button>
                </div>
            </div>
        </header>

        <nav class="flex items-center space-x-2 mb-4 bg-white p-2 rounded-xl border border-gray-200 shadow-xs overflow-x-auto custom-scroll">
            <button onclick="switchMainView('MATRIX')" id="nav-btn-matrix" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white transition flex items-center space-x-1.5 whitespace-nowrap">
                <span>📊 新品排期推进矩阵</span>
                <span id="nav-count-matrix" class="bg-blue-800 text-white text-[10px] px-1.5 py-0.2 rounded-full font-mono">0</span>
            </button>
            <button onclick="switchMainView('BARCODES')" id="nav-btn-barcodes" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-gray-100 text-gray-600 hover:text-gray-900 transition flex items-center space-x-1.5 whitespace-nowrap">
                <span>🏷️ 69码与编码库 (Gist)</span>
                <span id="nav-count-barcodes" class="bg-gray-200 text-gray-700 text-[10px] px-1.5 py-0.2 rounded-full font-mono">0</span>
            </button>
            <button onclick="switchMainView('PRICES')" id="nav-btn-prices" class="px-3.5 py-1.5 rounded-lg text-xs font-bold bg-gray-100 text-gray-600 hover:text-gray-900 transition flex items-center space-x-1.5 whitespace-nowrap">
                <span>💰 全渠道价格中心</span>
                <span id="nav-count-prices" class="bg-gray-200 text-gray-700 text-[10px] px-1.5 py-0.2 rounded-full font-mono">0</span>
            </button>
        </nav>

        <div id="module-matrix" class="space-y-4">
            <div id="admin-create-panel" class="bg-white p-3.5 sm:p-5 rounded-xl border border-gray-200 shadow-sm">
                <h2 class="text-xs sm:text-sm font-bold text-gray-800 mb-2 sm:mb-3">⚡ 批量粘贴 SKU 自动裂变生成 (内置防重检测)</h2>
                <div class="mb-2.5">
                    <label class="block text-gray-700 font-semibold mb-1 text-[11px] sm:text-xs">
                        子变体 / SKU 列表 <span class="text-red-500">*</span> <span class="text-gray-400 font-normal">(支持表格多行直接粘贴)</span>
                    </label>
                    <textarea id="p-skus-batch" rows="3" placeholder="HD-LD22-H枪灰色1.3&#10;HD-LD22-H枪灰色1.5&#10;HD-LD22-H奶白色1.3-1&#10;HD-LD22-H奶白色1.5-1" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-gray-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"></textarea>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-2.5 text-xs mb-1">
                    <div>
                        <label class="block text-gray-600 font-medium mb-1 text-[11px]">主产品型号 / 系列名 <span class="text-gray-400">(选填)</span></label>
                        <input type="text" id="p-name" placeholder="自动提取如: HD-LD22-H" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-2.5 py-1.5 text-gray-900 text-xs focus:bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 font-medium mb-1 text-[11px]">品类 / 渠道 <span class="text-red-500">*</span></label>
                        <input type="text" id="p-category" placeholder="如: 落地 / 手摇" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-2.5 py-1.5 text-gray-900 text-xs focus:bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-gray-600 font-medium mb-1 text-[11px]">量产大货截点 <span class="text-red-500">*</span></label>
                        <input type="date" id="p-prod-date" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-2.5 py-1.5 text-gray-900 text-xs focus:bg-white focus:outline-none focus:ring-1 focus:ring-blue-500">
                    </div>
                    <div class="flex items-end">
                        <button onclick="addProductWithBatchSkus()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-1.5 sm:py-2 rounded-lg font-bold shadow-sm transition text-xs">🚀 智能查重并创建</button>
                    </div>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <button onclick="switchTab('RUNNING')" id="tab-btn-running" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-blue-600 text-white shadow-sm transition flex items-center space-x-1.5">
                    <span>⚡ 进行中看板</span>
                    <span id="tab-count-running" class="bg-blue-800 text-white text-[10px] px-2 py-0.5 rounded-full font-mono">0</span>
                </button>
                <button onclick="switchTab('ARCHIVED')" id="tab-btn-archived" class="px-4 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white text-gray-600 hover:text-gray-900 border border-gray-200 shadow-sm transition flex items-center space-x-1.5">
                    <span>📦 已归档历史库</span>
                    <span id="tab-count-archived" class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-full font-mono">0</span>
                </button>
            </div>

            <div class="bg-white p-3.5 rounded-xl border border-gray-200 shadow-sm text-xs space-y-2.5">
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <div class="flex items-center space-x-1.5 font-bold text-gray-800">
                        <span>🔍 智能筛选器</span>
                        <span id="filter-result-count" class="text-[10px] bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-full font-normal">显示全部</span>
                    </div>
                    <button onclick="resetAllFilters()" class="text-[11px] text-gray-400 hover:text-blue-600 underline">重置筛选</button>
                </div>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <div>
                        <label class="block text-gray-500 text-[10px] mb-0.5">品类/渠道</label>
                        <select id="filter-category" onchange="renderTable()" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-xs text-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="ALL">全部品类</option>
                        </select>
                    </div>
                    <div id="filter-health-box">
                        <label class="block text-gray-500 text-[10px] mb-0.5">健康度预警</label>
                        <select id="filter-health" onchange="renderTable()" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-xs text-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <option value="ALL">全部排期</option>
                            <option value="DELAY">🚨 仅看延期项目</option>
                            <option value="URGENT_DAYS">⚠️ 7天内即将大货</option>
                            <option value="NORMAL">🟢 正常推进中</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-500 text-[10px] mb-0.5">大备注备忘</label>
                        <select id="filter-bignote" onchange="renderTable()" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-2 py-1.5 text-xs text-gray-800 focus:outline-none focus:ring-1 focus:ring-blue-500">
