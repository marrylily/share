<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商新品生命周期推进矩阵</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

    <div class="container mx-auto px-4 py-6 max-w-7xl">
        <!-- 顶部导航与状态 -->
        <header class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl border border-gray-200 shadow-sm">
            <div>
                <h1 class="text-xl font-bold text-gray-900">📊 新品生命周期推进与审计追溯中枢</h1>
                <p class="text-xs text-gray-500 mt-0.5">主品聚合 · 子 SKU 批量录入 · 变更留痕 · 归档时间追溯</p>
            </div>
            <div class="flex items-center space-x-3">
                <span id="auth-tag" class="text-xs bg-red-100 text-red-700 border border-red-200 px-3 py-1 rounded-full font-medium">未连接云端</span>
                <button onclick="toggleConfigModal()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-xs border border-gray-300 font-medium">⚙️ 配置</button>
            </div>
        </header>

        <!-- 批量新建产品录入栏 -->
        <div class="bg-white p-5 rounded-xl border border-gray-200 shadow-sm mb-6">
            <h2 class="text-sm font-bold text-gray-800 mb-3 flex items-center">
                <span>➕ 批量录入新品系列及变体 SKU</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 text-xs mb-3">
                <div>
                    <label class="block text-gray-600 font-medium mb-1">主产品型号 / 系列名 <span class="text-red-500">*</span></label>
                    <input type="text" id="p-name" placeholder="如: HD-LD22-H 系列" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">品类 / 渠道</label>
                    <input type="text" id="p-category" placeholder="如: 落地晾衣架" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">量产大货截点 <span class="text-red-500">*</span></label>
                    <input type="date" id="p-prod-date" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-end">
                    <button onclick="addProductWithBatchSkus()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg font-bold shadow-sm transition">⚡ 批量创建并建立父子矩阵</button>
                </div>
            </div>
            <div>
                <label class="block text-gray-600 font-medium mb-1">
                    子变体 / SKU 列表 <span class="text-gray-400 font-normal">(一行一个，可直接从 Excel / 表格复制粘贴多行)</span>
                </label>
                <textarea id="p-skus-batch" rows="3" placeholder="HD-LD22-H奶白色1.3&#10;HD-LD22-H奶白色1.5&#10;HD-LD22-H枪灰色1.3&#10;HD-LD22-H枪灰色1.5" class="w-full bg-gray-50 border border-gray-300 rounded-lg p-2 text-gray-900 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>
        </div>

        <!-- 统计筛选条 -->
        <div class="flex justify-between items-center mb-3 text-xs text-gray-600 px-1">
            <div class="flex items-center space-x-4">
                <span>总系列: <strong id="stat-total" class="text-gray-900">0</strong></span>
                <span>🚨 延期预警: <strong id="stat-delay" class="text-red-600 font-bold">0</strong></span>
                <span>⚡ 推进中: <strong id="stat-running" class="text-blue-600 font-bold">0</strong></span>
                <span>✅ 已归档: <strong id="stat-archived" class="text-green-600 font-bold">0</strong></span>
            </div>
            <div id="sync-status" class="text-gray-500 font-medium">状态检测中...</div>
        </div>

        <!-- 主表格 -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto custom-scroll">
                <table class="w-full text-left text-xs text-gray-700">
                    <thead class="bg-gray-50 text-gray-600 font-bold border-b border-gray-200">
                        <tr>
                            <th class="p-3.5 w-12 text-center">展开</th>
                            <th class="p-3.5 min-w-[220px]">产品型号 / 系列</th>
                            <th class="p-3.5 min-w-[120px]">品类</th>
                            <th class="p-3.5 min-w-[140px]">量产大货时间</th>
                            <th class="p-3.5 min-w-[160px]">健康度 / 归档时间</th>
                            <th class="p-3.5 min-w-[100px]">状态</th>
                            <th class="p-3.5 text-right min-w-[200px]">操作与审计</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body" class="divide-y divide-gray-200 font-normal">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 修改产品信息弹窗 -->
    <div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden backdrop-blur-sm z-40">
        <div class="bg-white border border-gray-200 p-6 rounded-xl w-full max-w-md shadow-2xl text-gray-800 text-xs">
            <h2 class="text-sm font-bold text-gray-900 mb-4 flex items-center justify-between">
                <span>✏️ 修改产品及节点 (原记录将自动保存)</span>
                <span id="edit-prod-id" class="text-[10px] text-gray-400 font-mono"></span>
            </h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-gray-600 font-medium mb-1">产品型号 / 系列</label>
                    <input type="text" id="edit-name" class="w-full border border-gray-300 rounded p-2 text-gray-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">品类</label>
                    <input type="text" id="edit-category" class="w-full border border-gray-300 rounded p-2 text-gray-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">量产大货截点</label>
                    <input type="date" id="edit-prod-date" class="w-full border border-gray-300 rounded p-2 text-gray-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">本次变动原因 / 备注说明</label>
                    <input type="text" id="edit-reason" placeholder="如: 工厂排产调整、配件延迟..." class="w-full border border-gray-300 rounded p-2 text-gray-900 focus:outline-none focus:ring-1 focus:ring-blue-500">
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-5">
                <button onclick="closeEditModal()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded font-medium">取消</button>
                <button onclick="saveEditChanges()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded font-medium">确认修改并留痕</button>
            </div>
        </div>
    </div>

    <!-- 追溯记录弹窗 -->
    <div id="logs-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden backdrop-blur-sm z-50">
        <div class="bg-white border border-gray-200 p-6 rounded-xl w-full max-w-2xl shadow-2xl text-gray-800 text-xs">
            <div class="flex justify-between items-center mb-4 border-b border-gray-100 pb-3">
                <h2 class="text-sm font-bold flex items-center space-x-2">
                    <span>📜 全生命周期变更与归档追溯</span>
                    <span id="logs-title" class="text-blue-600 font-normal"></span>
                </h2>
                <button onclick="closeLogsModal()" class="text-gray-400 hover:text-gray-600 text-base font-bold">✕</button>
            </div>
            <div class="max-h-[380px] overflow-y-auto custom-scroll space-y-2.5 pr-2" id="logs-container">
            </div>
            <div class="flex justify-end mt-4">
                <button onclick="closeLogsModal()" class="px-4 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded font-medium">关闭</button>
            </div>
        </div>
    </div>

    <!-- 配置弹窗 -->
    <div id="config-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden backdrop-blur-sm z-50">
        <div class="bg-white border border-gray-200 p-6 rounded-xl w-full max-w-md shadow-2xl text-gray-800 text-xs">
            <h2 class="text-sm font-bold text-gray-900 mb-4">⚙️ GitHub 云端同步配置</h2>
            <div class="space-y-3">
                <div>
                    <label class="block text-gray-600 font-medium mb-1">GitHub 用户名</label>
                    <input type="text" id="cfg-owner" class="w-full border border-gray-300 rounded p-2 text-gray-900">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">私有仓库名称 (存放数据)</label>
                    <input type="text" id="cfg-repo" class="w-full border border-gray-300 rounded p-2 text-gray-900" placeholder="my-tasks">
                </div>
                <div>
                    <label class="block text-gray-600 font-medium mb-1">Personal Access Token</label>
                    <input type="password" id="cfg-token" class="w-full border border-gray-300 rounded p-2 text-gray-900">
                </div>
            </div>
            <div class="flex justify-end space-x-2 mt-5">
                <button onclick="toggleConfigModal()" class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded">取消</button>
                <button onclick="saveConfigAndSync()" class="px-3 py-1.5 bg-blue-600 text-white rounded font-medium">保存配置</button>
            </div>
        </div>
    </div>

    <script>
        let products = [];
        let fileSha = "";
        let expandedRows = {};
        let currentEditingIndex = -1;

        window.onload = function() {
            const d = new Date();
            d.setDate(d.getDate() + 30);
            document.getElementById("p-prod-date").value = d.toISOString().split('T')[0];

            if (localStorage.getItem("wb_token")) {
                document.getElementById("cfg-owner").value = localStorage.getItem("wb_owner") || "";
                document.getElementById("cfg-repo").value = localStorage.getItem("wb_repo") || "";
                document.getElementById("cfg-token").value = localStorage.getItem("wb_token") || "";
                fetchFromCloud();
            }
        }

        function toggleConfigModal() {
            document.getElementById("config-modal").classList.toggle("hidden");
        }

        function saveConfigAndSync() {
            localStorage.setItem("wb_owner", document.getElementById("cfg-owner").value.trim());
            localStorage.setItem("wb_repo", document.getElementById("cfg-repo").value.trim());
            localStorage.setItem("wb_token", document.getElementById("cfg-token").value.trim());
            toggleConfigModal();
            fetchFromCloud();
        }

        function getNowString() {
            const now = new Date();
            return now.getFullYear() + "-" + 
                   String(now.getMonth() + 1).padStart(2, '0') + "-" + 
                   String(now.getDate()).padStart(2, '0') + " " + 
                   String(now.getHours()).padStart(2, '0') + ":" + 
                   String(now.getMinutes()).padStart(2, '0');
        }

        // 批量创建产品与子变体
        function addProductWithBatchSkus() {
            const name = document.getElementById("p-name").value.trim();
            const prodDate = document.getElementById("p-prod-date").value;
            if (!name) return alert("请输入主产品型号或系列名称！");
            if (!prodDate) return alert("请选择量产大货时间！");

            const batchText = document.getElementById("p-skus-batch").value.trim();
            const lines = batchText ? batchText.split('\n').map(l => l.trim()).filter(l => l.length > 0) : [];

            let skusList = [];
            if (lines.length > 0) {
                lines.forEach((skuLine, i) => {
                    skusList.push({
                        id: "S_" + Date.now() + "_" + i,
                        name: skuLine,
                        bomOk: false,
                        detailOk: false,
                        sapOk: false
                    });
                });
            } else {
                skusList.push({
                    id: "S_" + Date.now(),
                    name: name + " (基础标配)",
                    bomOk: false,
                    detailOk: false,
                    sapOk: false
                });
            }

            const nowTime = getNowString();
            const newProd = {
                id: "P_" + Date.now(),
                name: name,
                category: document.getElementById("p-category").value.trim() || "未分类",
                prodDate: prodDate,
                status: "进行中",
                archivedAt: null,
                createdAt: nowTime,
                historyLogs: [
                    { time: nowTime, type: "CREATE", desc: `初始化创建产品系列【${name}】，包含 ${skusList.length} 个规格变体` }
                ],
                skus: skusList
            };

            products.unshift(newProd);
            expandedRows[newProd.id] = true;
            document.getElementById("p-name").value = "";
            document.getElementById("p-skus-batch").value = "";
            renderTable();
            syncToCloud();
        }

        // 打开编辑
        function openEditModal(index) {
            currentEditingIndex = index;
            const p = products[index];
            document.getElementById("edit-prod-id").innerText = p.id;
            document.getElementById("edit-name").value = p.name;
            document.getElementById("edit-category").value = p.category;
            document.getElementById("edit-prod-date").value = p.prodDate || "";
            document.getElementById("edit-reason").value = "";
            document.getElementById("edit-modal").classList.remove("hidden");
        }

        function closeEditModal() {
            document.getElementById("edit-modal").classList.add("hidden");
            currentEditingIndex = -1;
        }

        // 保存编辑留痕
        function saveEditChanges() {
            if (currentEditingIndex === -1) return;
            const p = products[currentEditingIndex];
            const newName = document.getElementById("edit-name").value.trim();
            const newCategory = document.getElementById("edit-category").value.trim();
            const newProdDate = document.getElementById("edit-prod-date").value;
            const reason = document.getElementById("edit-reason").value.trim();

            if (!newName) return alert("产品名称不能为空！");

            let changes = [];
            if (p.name !== newName) changes.push(`型号由【${p.name}】更改为【${newName}】`);
            if (p.category !== newCategory) changes.push(`品类由【${p.category}】更改为【${newCategory}】`);
            if (p.prodDate !== newProdDate) changes.push(`量产大货时间由【${p.prodDate || '未设'}】更改为【${newProdDate || '未设'}】`);

            if (changes.length > 0) {
                const nowTime = getNowString();
                if (!p.historyLogs) p.historyLogs = [];
                p.historyLogs.unshift({
                    time: nowTime,
                    type: "UPDATE",
                    desc: changes.join("； ") + (reason ? ` (备注: ${reason})` : "")
                });

                p.name = newName;
                p.category = newCategory;
                p.prodDate = newProdDate;

                closeEditModal();
                renderTable();
                syncToCloud();
            } else {
                closeEditModal();
            }
        }

        function changeProdStatus(pIdx, val) {
            const p = products[pIdx];
            const oldStatus = p.status;
            if (oldStatus === val) return;

            const nowTime = getNowString();
            p.status = val;
            if (!p.historyLogs) p.historyLogs = [];

            if (val === "已归档") {
                p.archivedAt = nowTime;
                p.historyLogs.unshift({
                    time: nowTime,
                    type: "ARCHIVE",
                    desc: `项目已完成并执行归档`
                });
            } else {
                p.archivedAt = null;
                p.historyLogs.unshift({
                    time: nowTime,
                    type: "STATUS_CHANGE",
                    desc: `状态由【${oldStatus}】变更为【${val}】`
                });
            }

            renderTable();
            syncToCloud();
        }

        function openLogsModal(index) {
            const p = products[index];
            document.getElementById("logs-title").innerText = `【${p.name}】`;
            const container = document.getElementById("logs-container");
            container.innerHTML = "";

            const logs = p.historyLogs || [];
            if (logs.length === 0) {
                container.innerHTML = `<div class="text-gray-400 text-center py-6">暂无历史追溯记录</div>`;
            } else {
                logs.forEach(log => {
                    let badgeClass = "bg-gray-100 text-gray-700 border-gray-300";
                    let label = "流转";
                    if (log.type === "CREATE") { badgeClass = "bg-blue-50 text-blue-700 border-blue-200"; label = "创建"; }
                    else if (log.type === "ARCHIVE") { badgeClass = "bg-green-50 text-green-700 border-green-200"; label = "归档"; }
                    else if (log.type === "UPDATE") { badgeClass = "bg-yellow-50 text-yellow-700 border-yellow-200"; label = "变更"; }

                    const item = document.createElement("div");
                    item.className = "bg-gray-50 p-3 rounded-lg border border-gray-200 flex items-start space-x-3";
                    item.innerHTML = `
                        <span class="border px-1.5 py-0.5 rounded text-[10px] font-bold ${badgeClass}">${label}</span>
                        <div class="flex-1">
                            <div class="text-gray-800 leading-relaxed text-xs">${escapeHtml(log.desc)}</div>
                            <div class="text-[10px] text-gray-500 font-mono mt-1">记录时间: ${log.time}</div>
                        </div>
                    `;
                    container.appendChild(item);
                });
            }
            document.getElementById("logs-modal").classList.remove("hidden");
        }

        function closeLogsModal() {
            document.getElementById("logs-modal").classList.add("hidden");
        }

        function addSku(prodIndex) {
            const skuName = prompt("请输入子规格名称 (如: 枪灰1.5m / 奶白1.3m):");
            if (!skuName) return;
            const nowTime = getNowString();
            const p = products[prodIndex];
            p.skus.push({
                id: "S_" + Date.now(),
                name: skuName.trim(),
                bomOk: false,
                detailOk: false,
                sapOk: false
            });
            if (!p.historyLogs) p.historyLogs = [];
            p.historyLogs.unshift({
                time: nowTime,
                type: "UPDATE",
                desc: `新增变体规格【${skuName.trim()}】`
            });
            expandedRows[p.id] = true;
            renderTable();
            syncToCloud();
        }

        function editSkuName(prodIndex, skuIndex) {
            const sku = products[prodIndex].skus[skuIndex];
            const newName = prompt("修改变体规格名称:", sku.name);
            if (newName && newName.trim() !== sku.name) {
                const oldName = sku.name;
                sku.name = newName.trim();
                const nowTime = getNowString();
                if (!products[prodIndex].historyLogs) products[prodIndex].historyLogs = [];
                products[prodIndex].historyLogs.unshift({
                    time: nowTime,
                    type: "UPDATE",
                    desc: `规格【${oldName}】变更为【${sku.name}】`
                });
                renderTable();
                syncToCloud();
            }
        }

        function removeSku(prodIndex, skuIndex) {
            const skuName = products[prodIndex].skus[skuIndex].name;
            if (confirm(`确定删除子规格【${skuName}】吗？`)) {
                products[prodIndex].skus.splice(skuIndex, 1);
                const nowTime = getNowString();
                if (!products[prodIndex].historyLogs) products[prodIndex].historyLogs = [];
                products[prodIndex].historyLogs.unshift({
                    time: nowTime,
                    type: "UPDATE",
                    desc: `删除了子规格【${skuName}】`
                });
                renderTable();
                syncToCloud();
            }
        }

        function toggleSkuCheck(prodIndex, skuIndex, key, label) {
            const sku = products[prodIndex].skus[skuIndex];
            sku[key] = !sku[key];
            const nowTime = getNowString();
            if (!products[prodIndex].historyLogs) products[prodIndex].historyLogs = [];
            products[prodIndex].historyLogs.unshift({
                time: nowTime,
                type: "UPDATE",
                desc: `【${sku.name}】的【${label}】标记为: ${sku[key] ? '已完成 ✅' : '未完成 ❌'}`
            });
            renderTable();
            syncToCloud();
        }

        function toggleExpand(id) {
            expandedRows[id] = !expandedRows[id];
            renderTable();
        }

        function removeProduct(index) {
            if (confirm(`确定删除该产品系列【${products[index].name}】吗？`)) {
                delete expandedRows[products[index].id];
                products.splice(index, 1);
                renderTable();
                syncToCloud();
            }
        }

        function renderTable() {
            const tbody = document.getElementById("product-table-body");
            tbody.innerHTML = "";

            const today = new Date().toISOString().split('T')[0];
            let delayCount = 0;
            let runningCount = 0;
            let archivedCount = 0;

            products.forEach((prod, pIdx) => {
                if (prod.status === "进行中") runningCount++;
                if (prod.status === "已归档") archivedCount++;

                let isDelayed = false;
                let statusBadge = "";

                if (prod.status === "已归档") {
                    statusBadge = `<span class="text-green-700 font-bold bg-green-50 px-2 py-0.5 rounded border border-green-200">✅ 归档于 ${prod.archivedAt ? prod.archivedAt.split(' ')[0] : '已完成'}</span>`;
                } else if (prod.prodDate) {
                    const diffDays = Math.ceil((new Date(prod.prodDate) - new Date(today)) / (1000 * 60 * 60 * 24));
                    if (diffDays < 0) {
                        isDelayed = true;
                        delayCount++;
                        statusBadge = `<span class="bg-red-100 text-red-700 border border-red-300 px-2 py-0.5 rounded font-bold">🚨 延期 ${Math.abs(diffDays)} 天</span>`;
                    } else if (diffDays <= 7) {
                        statusBadge = `<span class="bg-yellow-100 text-yellow-800 border border-yellow-300 px-2 py-0.5 rounded font-bold">⚠️ 剩余 ${diffDays} 天</span>`;
                    } else {
                        statusBadge = `<span class="text-gray-600 bg-gray-100 px-2 py-0.5 rounded border border-gray-200">倒计时 ${diffDays} 天</span>`;
                    }
                }

                const isExpanded = !!expandedRows[prod.id];
                const skuCount = prod.skus ? prod.skus.length : 0;
                const logCount = prod.historyLogs ? prod.historyLogs.length : 0;

                const tr = document.createElement("tr");
                tr.className = `hover:bg-blue-50/40 transition-colors ${isDelayed ? 'bg-red-50/30' : ''} ${prod.status === '已归档' ? 'bg-gray-50 text-gray-400' : ''}`;
                tr.innerHTML = `
                    <td class="p-3.5 text-center">
                        <button onclick="toggleExpand('${prod.id}')" class="text-gray-500 hover:text-blue-600 text-xs font-mono font-bold">
                            ${isExpanded ? '▼' : '▶'}
                        </button>
                    </td>
                    <td class="p-3.5 font-bold text-gray-900 flex items-center space-x-2">
                        <span>${escapeHtml(prod.name)}</span>
                        <span class="bg-gray-100 text-gray-600 text-[10px] px-2 py-0.5 rounded-full border border-gray-200 font-normal">${skuCount} SKU</span>
                    </td>
                    <td class="p-3.5 text-gray-600">${escapeHtml(prod.category)}</td>
                    <td class="p-3.5 font-mono ${isDelayed ? 'text-red-600 font-bold' : 'text-gray-700'}">${prod.prodDate || '-'}</td>
                    <td class="p-3.5">${statusBadge}</td>
                    <td class="p-3.5">
                        <select onchange="changeProdStatus(${pIdx}, this.value)" class="bg-white border border-gray-300 rounded px-2 py-1 text-xs text-gray-700 focus:outline-none">
                            <option value="进行中" ${prod.status === '进行中' ? 'selected' : ''}>⚡ 进行中</option>
                            <option value="已归档" ${prod.status === '已归档' ? 'selected' : ''}>✅ 已归档</option>
                        </select>
                    </td>
                    <td class="p-3.5 text-right space-x-2 font-medium">
                        <button onclick="openEditModal(${pIdx})" class="text-blue-600 hover:underline">修改</button>
                        <button onclick="openLogsModal(${pIdx})" class="text-indigo-600 hover:underline">追溯(${logCount})</button>
                        <button onclick="addSku(${pIdx})" class="text-emerald-600 hover:underline">+规格</button>
                        <button onclick="removeProduct(${pIdx})" class="text-red-600 hover:underline">删除</button>
                    </td>
                `;
                tbody.appendChild(tr);

                // 子 SKU 抽屉
                if (isExpanded) {
                    const subTr = document.createElement("tr");
                    subTr.className = "bg-gray-50/80";
                    let subHtml = `
                        <td colspan="7" class="p-4 pl-12">
                            <div class="bg-white rounded-lg p-3.5 border border-gray-200 shadow-sm">
                                <div class="flex justify-between items-center mb-2.5">
                                    <span class="text-xs font-bold text-gray-700">📋 【${escapeHtml(prod.name)}】变体规格对接列表：</span>
                                    <button onclick="addSku(${pIdx})" class="text-blue-600 hover:underline text-xs font-medium">+ 添加新规格</button>
                                </div>
                                <div class="space-y-2">
                    `;
                    prod.skus.forEach((sku, sIdx) => {
                        subHtml += `
                            <div class="flex items-center justify-between bg-gray-50 hover:bg-gray-100/80 p-2.5 rounded border border-gray-200 text-xs transition">
                                <div class="flex items-center space-x-2">
                                    <span class="text-gray-800 font-semibold">${escapeHtml(sku.name)}</span>
                                    <button onclick="editSkuName(${pIdx}, ${sIdx})" class="text-gray-400 hover:text-gray-600" title="修改规格名">✏️</button>
                                    <button onclick="removeSku(${pIdx}, ${sIdx})" class="text-red-400 hover:text-red-600" title="删除规格">🗑️</button>
                                </div>
                                <div class="flex items-center space-x-6">
                                    <label class="flex items-center space-x-1.5 cursor-pointer">
                                        <input type="checkbox" onchange="toggleSkuCheck(${pIdx}, ${sIdx}, 'bomOk', '包材/BOM确认')" ${sku.bomOk ? 'checked' : ''} class="w-4 h-4 rounded text-blue-600 border-gray-300 focus:ring-0">
                                        <span class="${sku.bomOk ? 'text-green-700 font-bold' : 'text-gray-500'}">包材/BOM确认</span>
                                    </label>
                                    <label class="flex items-center space-x-1.5 cursor-pointer">
                                        <input type="checkbox" onchange="toggleSkuCheck(${pIdx}, ${sIdx}, 'detailOk', '策划/详情页验收')" ${sku.detailOk ? 'checked' : ''} class="w-4 h-4 rounded text-blue-600 border-gray-300 focus:ring-0">
                                        <span class="${sku.detailOk ? 'text-green-700 font-bold' : 'text-gray-500'}">策划/详情页验收</span>
                                    </label>
                                    <label class="flex items-center space-x-1.5 cursor-pointer">
                                        <input type="checkbox" onchange="toggleSkuCheck(${pIdx}, ${sIdx}, 'sapOk', 'SAP/ERP编码录入')" ${sku.sapOk ? 'checked' : ''} class="w-4 h-4 rounded text-blue-600 border-gray-300 focus:ring-0">
                                        <span class="${sku.sapOk ? 'text-green-700 font-bold' : 'text-gray-500'}">SAP/ERP编码录入</span>
                                    </label>
                                </div>
                            </div>
                        `;
                    });
                    subHtml += `</div></div></td>`;
                    subTr.innerHTML = subHtml;
                    tbody.appendChild(subTr);
                }
            });

            document.getElementById("stat-total").innerText = products.length;
            document.getElementById("stat-delay").innerText = delayCount;
            document.getElementById("stat-running").innerText = runningCount;
            document.getElementById("stat-archived").innerText = archivedCount;
        }

        async function fetchFromCloud() {
            const owner = localStorage.getItem("wb_owner");
            const repo = localStorage.getItem("wb_repo");
            const token = localStorage.getItem("wb_token");
            if (!token || !owner) return;

            document.getElementById("sync-status").innerText = "拉取最新矩阵中...";
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/products_matrix.json`, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (res.status === 404) {
                    products = [];
                    fileSha = "";
                    document.getElementById("sync-status").innerText = "已就绪 (新文件)";
                    document.getElementById("auth-tag").innerText = `已连接: ${owner}`;
                    document.getElementById("auth-tag").className = "text-xs bg-green-100 text-green-800 border border-green-200 px-3 py-1 rounded-full font-medium";
                    renderTable();
                    return;
                }

                const data = await res.json();
                fileSha = data.sha;
                products = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                document.getElementById("sync-status").innerText = "已同步最新";
                document.getElementById("auth-tag").innerText = `已连接: ${owner}`;
                document.getElementById("auth-tag").className = "text-xs bg-green-100 text-green-800 border border-green-200 px-3 py-1 rounded-full font-medium";
                renderTable();
            } catch (err) {
                console.error(err);
                document.getElementById("sync-status").innerText = "同步异常";
            }
        }

        async function syncToCloud() {
            const owner = localStorage.getItem("wb_owner");
            const repo = localStorage.getItem("wb_repo");
            const token = localStorage.getItem("wb_token");
            if (!token) return;

            document.getElementById("sync-status").innerText = "正在写入云端...";
            try {
                // 实时拉取一次 sha 防止并发覆盖冲突
                const checkRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/products_matrix.json`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if (checkRes.ok) {
                    const checkData = await checkRes.json();
                    fileSha = checkData.sha;
                }

                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(products, null, 2))));
                const body = {
                    message: "Update products matrix & audit logs",
                    content: encoded
                };
                if (fileSha) body.sha = fileSha;

                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/products_matrix.json`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });

                if (!res.ok) throw new Error("写入失败");
                const result = await res.json();
                fileSha = result.content.sha;
                document.getElementById("sync-status").innerText = "云端已保存 ✅";
            } catch (err) {
                console.error(err);
                document.getElementById("sync-status").innerText = "保存失败 ❌ (检查 Token 权限)";
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
