<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkBuddy - 自动化项目任务管理</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- 顶部导航与自动化状态 -->
        <header class="flex justify-between items-center mb-8 bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-lg">
            <div>
                <h1 class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500">🤖 WorkBuddy 自动化任务流</h1>
                <p class="text-xs text-gray-400 mt-1">Status: 云端自动同步中 | 内存零占用架构</p>
            </div>
            <div class="flex items-center space-x-3">
                <span id="auth-tag" class="text-xs bg-red-900 text-red-200 px-3 py-1 rounded-full">未绑定云端</span>
                <button onclick="toggleConfigModal()" class="bg-gray-700 hover:bg-gray-600 text-gray-200 px-3 py-1.5 rounded-lg text-xs font-medium">⚙️ 账号配置</button>
            </div>
        </header>

        <!-- 自动化控制台/快捷操作栏 -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex flex-col justify-between">
                <span class="text-gray-400 text-xs">自动同步引擎</span>
                <span id="sync-status" class="font-bold text-yellow-500 text-sm mt-1">等待配置</span>
            </div>
            <div class="md:col-span-3 bg-gray-800 p-4 rounded-xl border border-gray-700 flex items-center justify-between">
                <div class="flex space-x-2 w-full max-w-xl">
                    <input type="text" id="task-title" placeholder="输入任务名称，支持自动拆解子任务..." class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-blue-500">
                    <select id="task-priority" class="bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-300">
                        <option value="normal">普通优先级</option>
                        <option value="urgent">🔥 紧急任务</option>
                    </select>
                </div>
                <button onclick="addSmartTask()" class="ml-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-5 py-2 rounded-lg text-sm font-medium flex-shrink-0">⚡ 智能下发</button>
            </div>
        </div>

        <!-- 看板网格 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- 待办 -->
            <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/60 backdrop-blur">
                <h3 class="font-bold text-gray-300 mb-3 flex justify-between items-center text-sm">
                    <span>📌 待办队列 (To Do)</span>
                    <span id="count-todo" class="bg-gray-700 text-gray-300 text-xs px-2 py-0.5 rounded-full">0</span>
                </h3>
                <div id="list-todo" class="space-y-3 min-h-[300px]"></div>
            </div>
            <!-- 进行中 -->
            <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/60 backdrop-blur">
                <h3 class="font-bold text-blue-400 mb-3 flex justify-between items-center text-sm">
                    <span>⚡ 自动化执行中 (Doing)</span>
                    <span id="count-doing" class="bg-blue-900/50 text-blue-300 text-xs px-2 py-0.5 rounded-full">0</span>
                </h3>
                <div id="list-doing" class="space-y-3 min-h-[300px]"></div>
            </div>
            <!-- 已完成 -->
            <div class="bg-gray-800/60 p-4 rounded-xl border border-gray-700/60 backdrop-blur">
                <h3 class="font-bold text-green-400 mb-3 flex justify-between items-center text-sm">
                    <span>✅ 已归档 (Done)</span>
                    <span id="count-done" class="bg-green-900/50 text-green-300 text-xs px-2 py-0.5 rounded-full">0</span>
                </h3>
                <div id="list-done" class="space-y-3 min-h-[300px]"></div>
            </div>
        </div>
    </div>

    <!-- 配置弹窗 -->
    <div id="config-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl w-full max-w-md shadow-2xl text-gray-100">
            <h2 class="text-lg font-bold mb-4">⚙️ 关联 GitHub 自动化数据库</h2>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">GitHub 用户名</label>
                    <input type="text" id="cfg-owner" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 focus:outline-none focus:border-blue-500" placeholder="例如：your-name">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">私有仓库名称</label>
                    <input type="text" id="cfg-repo" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 focus:outline-none focus:border-blue-500" placeholder="例如：workbuddy-db">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">数据文件路径</label>
                    <input type="text" id="cfg-path" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 focus:outline-none focus:border-blue-500" value="tasks.json">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Personal Access Token</label>
                    <input type="password" id="cfg-token" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2 text-gray-100 focus:outline-none focus:border-blue-500" placeholder="ghp_xxxxxxxxxxxx">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button onclick="toggleConfigModal()" class="px-4 py-2 bg-gray-700 text-gray-300 rounded-lg text-sm">取消</button>
                <button onclick="saveConfigAndSync()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm">连接并初始化</button>
            </div>
        </div>
    </div>

    <script>
        let tasks = [];
        let fileSha = "";

        window.onload = function() {
            if (localStorage.getItem("wb_token")) {
                document.getElementById("cfg-owner").value = localStorage.getItem("wb_owner") || "";
                document.getElementById("cfg-repo").value = localStorage.getItem("wb_repo") || "";
                document.getElementById("cfg-path").value = localStorage.getItem("wb_path") || "tasks.json";
                document.getElementById("cfg-token").value = localStorage.getItem("wb_token") || "";
                fetchFromCloud();
            }
        }

        function toggleConfigModal() {
            document.getElementById("config-modal").classList.toggle("hidden");
        }

        function saveConfigAndSync() {
            const owner = document.getElementById("cfg-owner").value.trim();
            const repo = document.getElementById("cfg-repo").value.trim();
            const path = document.getElementById("cfg-path").value.trim() || "tasks.json";
            const token = document.getElementById("cfg-token").value.trim();

            if (!owner || !repo || !token) {
                alert("请完整填写配置项！");
                return;
            }

            localStorage.setItem("wb_owner", owner);
            localStorage.setItem("wb_repo", repo);
            localStorage.setItem("wb_path", path);
            localStorage.setItem("wb_token", token);

            toggleConfigModal();
            fetchFromCloud();
        }

        function updateAuthStatus(isLoggedIn, ownerName = "") {
            const tag = document.getElementById("auth-tag");
            if (isLoggedIn) {
                tag.innerText = `已连接: ${ownerName}`;
                tag.className = "text-xs bg-green-900 text-green-200 px-3 py-1 rounded-full";
            } else {
                tag.innerText = "未绑定云端";
                tag.className = "text-xs bg-red-900 text-red-200 px-3 py-1 rounded-full";
            }
        }

        function renderTasks() {
            ['todo', 'doing', 'done'].forEach(status => {
                document.getElementById(`list-${status}`).innerHTML = '';
                document.getElementById(`count-${status}`).innerText = '0';
            });

            tasks.forEach((task, index) => {
                const isUrgent = task.priority === 'urgent';
                const card = document.createElement('div');
                card.className = `bg-gray-900 p-3.5 rounded-xl border ${isUrgent ? 'border-red-500/50 shadow-red-900/20' : 'border-gray-700'} shadow-sm flex justify-between items-start`;
                card.innerHTML = `
                    <div class="pr-2">
                        ${isUrgent ? '<span class="text-[10px] bg-red-900 text-red-300 px-1.5 py-0.5 rounded mr-1">紧急</span>' : ''}
                        <span class="text-sm text-gray-200 break-all">${escapeHtml(task.title)}</span>
                        <div class="text-[10px] text-gray-500 mt-1">${new Date(task.createdAt).toLocaleString()}</div>
                    </div>
                    <div class="flex space-x-1 flex-shrink-0">
                        ${task.status !== 'todo' ? `<button onclick="moveTask(${index}, 'todo')" class="text-[10px] bg-gray-800 hover:bg-gray-700 px-1.5 py-1 rounded text-gray-300">待办</button>` : ''}
                        ${task.status !== 'doing' ? `<button onclick="moveTask(${index}, 'doing')" class="text-[10px] bg-blue-900/60 hover:bg-blue-800 px-1.5 py-1 rounded text-blue-300">执行</button>` : ''}
                        ${task.status !== 'done' ? `<button onclick="moveTask(${index}, 'done')" class="text-[10px] bg-green-900/60 hover:bg-green-800 px-1.5 py-1 rounded text-green-300">完成</button>` : ''}
                        <button onclick="removeTask(${index})" class="text-[10px] bg-red-900/40 hover:bg-red-800 px-1.5 py-1 rounded text-red-300">删</button>
                    </div>
                `;
                document.getElementById(`list-${task.status}`).appendChild(card);
            });

            ['todo', 'doing', 'done'].forEach(status => {
                const count = tasks.filter(t => t.status === status).length;
                document.getElementById(`count-${status}`).innerText = count;
            });
        }

        function addSmartTask() {
            const titleInput = document.getElementById("task-title");
            const priorityInput = document.getElementById("task-priority");
            const token = localStorage.getItem("wb_token");

            if (!token) {
                alert("请先点击右上角“账号配置”绑定 GitHub 数据库！");
                toggleConfigModal();
                return;
            }
            if (!titleInput.value.trim()) return alert("请输入任务标题！");

            tasks.unshift({
                title: titleInput.value.trim(),
                priority: priorityInput.value,
                status: 'todo',
                createdAt: new Date().toISOString()
            });
            titleInput.value = '';
            renderTasks();
            syncToCloud();
        }

        function moveTask(index, newStatus) {
            tasks[index].status = newStatus;
            renderTasks();
            syncToCloud();
        }

        function removeTask(index) {
            tasks.splice(index, 1);
            renderTasks();
            syncToCloud();
        }

        async function fetchFromCloud() {
            const owner = localStorage.getItem("wb_owner");
            const repo = localStorage.getItem("wb_repo");
            const path = localStorage.getItem("wb_path") || "tasks.json";
            const token = localStorage.getItem("wb_token");

            if (!token || !owner) return;

            document.getElementById("sync-status").innerText = "正在向云端拉取...";
            try {
                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    headers: { "Authorization": `token ${token}` }
                });

                if (res.status === 404) {
                    tasks = [];
                    fileSha = "";
                    document.getElementById("sync-status").innerText = "已连接 (将自动创建)";
                    updateAuthStatus(true, owner);
                    renderTasks();
                    return;
                }

                if (!res.ok) throw new Error("API 请求失败");

                const data = await res.json();
                fileSha = data.sha;
                tasks = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                document.getElementById("sync-status").innerText = "实时同步正常";
                updateAuthStatus(true, owner);
                renderTasks();
            } catch (err) {
                console.error(err);
                document.getElementById("sync-status").innerText = "同步异常 (检查配置)";
                updateAuthStatus(false);
            }
        }

        async function syncToCloud() {
            const owner = localStorage.getItem("wb_owner");
            const repo = localStorage.getItem("wb_repo");
            const path = localStorage.getItem("wb_path") || "tasks.json";
            const token = localStorage.getItem("wb_token");

            if (!token) return;

            document.getElementById("sync-status").innerText = "正在自动提交...";
            try {
                const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(tasks, null, 2))));
                const body = {
                    message: "WorkBuddy automated sync",
                    content: encoded
                };
                if (fileSha) body.sha = fileSha;

                const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${path}`, {
                    method: "PUT",
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });

                if (!res.ok) throw new Error("保存失败");
                const result = await res.json();
                fileSha = result.content.sha;
                document.getElementById("sync-status").innerText = "云端已最新";
            } catch (err) {
                console.error(err);
                document.getElementById("sync-status").innerText = "同步保存失败";
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
